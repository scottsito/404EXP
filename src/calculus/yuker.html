<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Euchre - Strategic AI & History</title>
    <style>
        :root { --green: #1a5d1a; --gold: #fbff00; --wood: #3e2723; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a2f0a; color: white; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        #game-world { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        /* Side Panels */
        #turn-tracker { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; border-left: 5px solid var(--gold); min-width: 160px; z-index: 100; border: 1px solid rgba(255,255,255,0.1); }
        .turn-label { font-size: 0.7rem; opacity: 0.6; }
        .turn-name { font-weight: bold; color: var(--gold); display: block; margin-top: 4px; font-size: 1.1rem; }

        #match-history { position: absolute; top: 20px; right: 20px; bottom: 20px; width: 220px; background: rgba(0,0,0,0.8); border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 10px; font-size: 0.85rem; z-index: 100; }
        #history-content { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .hist-entry { margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); line-height: 1.2; }
        .hist-entry.important { color: var(--gold); font-weight: bold; }

        /* UI Elements */
        .ui-top { position: absolute; top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 90; }
        .score-display { display: flex; gap: 40px; align-items: center; }
        .trick-count-box { background: rgba(0,0,0,0.7); padding: 6px 18px; border-radius: 20px; border: 1px solid var(--gold); display: flex; gap: 15px; font-size: 0.9rem; font-weight: bold; }
        
        /* Table & Cards */
        #table { position: relative; width: 600px; height: 400px; background: var(--green); border-radius: 220px; border: 10px solid var(--wood); box-shadow: inset 0 0 80px rgba(0,0,0,0.8); }
        #dealer-button { position: absolute; width: 35px; height: 35px; background: white; border-radius: 50%; color: black; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #333; transition: 0.6s; z-index: 10; font-size: 0.7rem; }
        
        .card { width: 70px; height: 100px; background: white; color: black; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; border: 1px solid #777; box-shadow: 2px 4px 10px rgba(0,0,0,0.5); transition: 0.3s; font-size: 1.1rem; pointer-events: none; }
        .card.red { color: #d32f2f; }
        .card.back { background: #b71c1c; border: 4px solid white; background-image: radial-gradient(circle, #ffffff 1px, transparent 1px); background-size: 8px 8px; }
        .card.playable { pointer-events: auto; cursor: pointer; }
        .card.playable:hover { transform: translateY(-10px); border-color: var(--gold); z-index: 100; }

        #kitty-container { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; transition: 0.5s; opacity: 0; }
        #kitty-container.active { opacity: 1; }

        /* Overlays */
        #ui-overlay { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); z-index: 200; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        #ui-overlay.visible { opacity: 1; pointer-events: auto; }
        .msg { font-size: 1.4rem; color: var(--gold); text-shadow: 2px 2px 8px black; background: rgba(0,0,0,0.9); padding: 15px 30px; border-radius: 12px; border: 2px solid var(--gold); }
        button { padding: 10px 20px; background: var(--gold); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 5px; box-shadow: 0 4px 0 #b7950b; }

        .hand { position: absolute; bottom: 20px; display: flex; gap: 8px; height: 110px; z-index: 20; }
        .player-label { position: absolute; font-size: 0.75rem; color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.5); padding: 2px 10px; border-radius: 10px; pointer-events: none; }
        .label-0 { bottom: 130px; left: 50%; transform: translateX(-50%); }
        .label-1 { left: 40px; top: 40%; transform: translateY(-50%); }
        .label-2 { top: 130px; left: 50%; transform: translateX(-50%); }
        .label-3 { right: 40px; top: 40%; transform: translateY(-50%); }
    </style>
</head>
<body>

<div id="game-world">
    <div id="turn-tracker">
        <span class="turn-label">CURRENT TURN</span>
        <span id="active-turn-name" class="turn-name">Ready?</span>
    </div>

    <div id="match-history">
        <div style="font-weight: bold; border-bottom: 2px solid var(--gold); margin-bottom: 10px; padding-bottom: 5px;">MATCH HISTORY</div>
        <div id="history-content"></div>
    </div>

    <div class="ui-top">
        <div class="score-display">
            <div style="text-align: center">US<br><b id="score-us">0</b></div>
            <div id="trump-indicator" style="font-size: 2rem; width: 40px; text-align: center;"></div>
            <div style="text-align: center">THEM<br><b id="score-them">0</b></div>
        </div>
        <div class="trick-count-box">Us: <span id="tricks-us">0</span> | Them: <span id="tricks-them">0</span></div>
    </div>

    <div id="ui-overlay" class="visible">
        <div id="message" class="msg">PRO EUCHRE</div>
        <div id="controls"><button onclick="initGame()">Start Game</button></div>
    </div>

    <div id="table">
        <div id="dealer-button">D</div>
        <div id="kitty-container"><div class="card back"></div><div id="up-card-slot"></div></div>
        <div class="player-label label-0">You</div>
        <div class="player-label label-1" id="name-1">Bot 1</div>
        <div class="player-label label-2" id="name-2">Partner</div>
        <div class="player-label label-3" id="name-3">Bot 3</div>
        <div id="played-cards-area"></div>
    </div>
    <div id="player-hand" class="hand"></div>
</div>

<script>
    const NAMES = ["Arthur", "Beatrice", "Winston", "Florence", "George", "Clara", "Harold", "Edith", "Reginald", "Mabel"];
    const SUITS = ['♠', '♣', '♥', '♦'], RANKS = ['9', '10', 'J', 'Q', 'K', 'A'];
    const COLORS = { '♠': 'black', '♣': 'black', '♥': 'red', '♦': 'red' };
    const SAME_COLOR = { '♠': '♣', '♣': '♠', '♥': '♦', '♦': '♥' };

    let deck = [], playerHand = [], bots = [[],[],[]], botNames = [];
    let trumpSuit = null, leadSuit = null, upCard = null;
    let scores = [0, 0], trickCounts = [0, 0], dealer = 0, turn = 0, caller = -1;
    let tableCards = [], isDiscarding = false, bidRound = 1;

    function addHistory(txt, important = false) {
        const content = document.getElementById('history-content');
        const entry = document.createElement('div');
        entry.className = 'hist-entry' + (important ? ' important' : '');
        entry.innerText = txt;
        content.appendChild(entry);
        content.scrollTop = content.scrollHeight;
    }

    function updateMsg(txt) {
        const overlay = document.getElementById('ui-overlay');
        document.getElementById('message').innerText = txt;
        txt === "" ? overlay.classList.remove('visible') : overlay.classList.add('visible');
    }

    function updateTurnTracker(custom) {
        const names = ["Your Turn", botNames[0], botNames[1], botNames[2]];
        document.getElementById('active-turn-name').innerText = custom || names[turn] || "...";
    }

    function getCardPower(card, trump, lead) {
        if (card.rank === 'J' && card.suit === trump) return 100;
        if (card.rank === 'J' && card.suit === SAME_COLOR[trump]) return 95;
        if (card.suit === trump) return RANKS.indexOf(card.rank) + 20;
        let effSuit = (card.rank === 'J' && card.suit === SAME_COLOR[trump]) ? trump : card.suit;
        if (lead && effSuit === lead) return RANKS.indexOf(card.rank) + 10;
        return RANKS.indexOf(card.rank);
    }

    function initGame() {
        scores = [0, 0]; dealer = 0;
        let shuffled = [...NAMES].sort(() => 0.5 - Math.random());
        botNames = [shuffled[0], shuffled[1], shuffled[2]];
        document.getElementById('name-1').innerText = botNames[0];
        document.getElementById('name-2').innerText = botNames[1] + " (P)";
        document.getElementById('name-3').innerText = botNames[2];
        document.getElementById('controls').innerHTML = '';
        addHistory("Game Started!", true);
        nextRound();
    }

    async function nextRound() {
        trickCounts = [0, 0]; tableCards = []; leadSuit = null; isDiscarding = false; bidRound = 1;
        document.getElementById('played-cards-area').innerHTML = '';
        document.getElementById('up-card-slot').innerHTML = '';
        document.getElementById('trump-indicator').innerText = "";
        document.getElementById('kitty-container').className = 'active';
        
        const pos = [{ b: "10px", l: "50%" }, { l: "10px", t: "50%" }, { t: "10px", l: "50%" }, { r: "10px", t: "50%" }];
        Object.assign(document.getElementById('dealer-button').style, { bottom: pos[dealer].b||'auto', top: pos[dealer].t||'auto', left: pos[dealer].l||'auto', right: pos[dealer].r||'auto' });

        const dName = dealer === 0 ? "You" : botNames[dealer-1];
        addHistory(`--- New Round: ${dName} deals ---`);

        deck = []; SUITS.forEach(s => RANKS.forEach(r => deck.push({ rank: r, suit: s })));
        deck.sort(() => Math.random() - 0.5);
        playerHand = deck.splice(0, 5); bots = [deck.splice(0, 5), deck.splice(0, 5), deck.splice(0, 5)];
        upCard = deck.splice(0, 1)[0];

        document.getElementById('up-card-slot').appendChild(createCardEl(upCard));
        renderHand();
        turn = (dealer + 1) % 4;
        startBidding();
    }

    function createCardEl(card, isBack = false) {
        const div = document.createElement('div');
        div.className = `card ${isBack ? 'back' : (COLORS[card.suit] === 'red' ? 'red' : '')}`;
        if (!isBack) div.innerHTML = `<div>${card.rank}</div><div>${card.suit}</div>`;
        return div;
    }

    function renderHand(playableCards = null) {
        const container = document.getElementById('player-hand');
        container.innerHTML = '';
        playerHand.forEach((card, i) => {
            const el = createCardEl(card);
            if (isDiscarding || !playableCards || playableCards.includes(card)) {
                el.classList.add('playable'); el.onclick = () => isDiscarding ? discard(i) : playToTable(i);
            }
            container.appendChild(el);
        });
    }

    function startBidding() {
        updateTurnTracker();
        if (turn === 0) {
            updateMsg(bidRound === 1 ? "Pick it up?" : "Choose Trump:");
            let btns = bidRound === 1 ? `<button onclick="confirmTrump('${upCard.suit}')">Order Up</button><button onclick="passBid()">Pass</button>` : 
                SUITS.filter(s => s !== upCard.suit).map(s => `<button onclick="confirmTrump('${s}')">${s}</button>`).join('') + `<button onclick="passBid()">Pass</button>`;
            document.getElementById('controls').innerHTML = btns;
        } else {
            setTimeout(botBid, 800);
        }
    }

    function botBid() {
        let hand = bots[turn-1];
        let trumps = hand.filter(c => c.suit === (bidRound === 1 ? upCard.suit : ""));
        if (trumps.length >= 3) confirmTrump(bidRound === 1 ? upCard.suit : SUITS.find(s=>s!==upCard.suit));
        else passBid();
    }

    function passBid() {
        const pName = turn === 0 ? "You" : botNames[turn-1];
        addHistory(`${pName} passed.`);
        turn = (turn + 1) % 4;
        if (turn === (dealer + 1) % 4) {
            if (bidRound === 1) { bidRound = 2; document.getElementById('up-card-slot').innerHTML = '❌'; startBidding(); }
            else { addHistory("Redealing hand.", true); nextRound(); }
        } else startBidding();
    }

    function confirmTrump(suit) {
        trumpSuit = suit; caller = turn;
        const pName = turn === 0 ? "You" : botNames[turn-1];
        addHistory(`${pName} called ${suit}!`, true);
        document.getElementById('trump-indicator').innerText = suit;
        document.getElementById('controls').innerHTML = '';
        document.getElementById('kitty-container').className = 'removed';
        if (bidRound === 1) {
            if (dealer === 0) { isDiscarding = true; updateMsg("Discard a card"); renderHand(); }
            else { if (dealer > 0) bots[dealer-1].splice(0, 1, upCard); startTrick(); }
        } else startTrick();
    }

    function discard(idx) { playerHand.splice(idx, 1, upCard); isDiscarding = false; updateMsg(""); startTrick(); }

    function startTrick() { updateMsg(""); tableCards = []; leadSuit = null; turn = (dealer + 1) % 4; processTurn(); }

    function processTurn() {
        if (tableCards.length === 4) { setTimeout(resolveTrick, 800); return; }
        updateTurnTracker();
        if (turn === 0) {
            let legal = playerHand.filter(c => {
                let s = (c.rank === 'J' && c.suit === SAME_COLOR[trumpSuit]) ? trumpSuit : c.suit;
                return !leadSuit || s === leadSuit;
            });
            renderHand(legal.length ? legal : playerHand);
        } else { setTimeout(botAIPlay, 800); }
    }

    function botAIPlay() {
        let hand = bots[turn-1];
        let legal = hand.filter(c => {
            let s = (c.rank === 'J' && c.suit === SAME_COLOR[trumpSuit]) ? trumpSuit : c.suit;
            return !leadSuit || s === leadSuit;
        });
        let chosen = legal[Math.floor(Math.random()*legal.length)];
        bots[turn-1] = hand.filter(c => c !== chosen);
        if (!leadSuit) leadSuit = (chosen.rank === 'J' && chosen.suit === SAME_COLOR[trumpSuit]) ? trumpSuit : chosen.suit;
        tableCards.push({ card: chosen, player: turn });
        animateMove(chosen, turn);
        turn = (turn + 1) % 4;
        processTurn();
    }

    function playToTable(idx) {
        const card = playerHand.splice(idx, 1)[0];
        if (!leadSuit) leadSuit = (card.rank === 'J' && card.suit === SAME_COLOR[trumpSuit]) ? trumpSuit : card.suit;
        tableCards.push({ card, player: 0 });
        animateMove(card, 0); renderHand([]); turn = (turn + 1) % 4; processTurn();
    }

    function animateMove(card, pIdx) {
        const el = createCardEl(card);
        const slots = [{ b: 50, l: 265 }, { b: 150, l: 150 }, { b: 250, l: 265 }, { b: 150, l: 380 }];
        Object.assign(el.style, { position: 'absolute', bottom: slots[pIdx].b+'px', left: slots[pIdx].l+'px' });
        document.getElementById('played-cards-area').appendChild(el);
    }

    function resolveTrick() {
        let winner = tableCards.reduce((a, b) => getCardPower(a.card, trumpSuit, leadSuit) > getCardPower(b.card, trumpSuit, leadSuit) ? a : b);
        trickCounts[(winner.player % 2 === 0) ? 0 : 1]++;
        const pName = winner.player === 0 ? "You" : botNames[winner.player-1];
        addHistory(`${pName} won the trick.`);
        updateScoreUI();
        setTimeout(() => {
            document.getElementById('played-cards-area').innerHTML = '';
            if (playerHand.length === 0) resolveRound();
            else { turn = winner.player; leadSuit = null; tableCards = []; processTurn(); }
        }, 1000);
    }

    function resolveRound() {
        let usCalled = (caller === 0 || caller === 2);
        let pts = 0;
        if (trickCounts[0] >= 3) {
            if (!usCalled) { pts = 2; addHistory("EUCHRED! Us gets 2 pts", true); }
            else { pts = (trickCounts[0] === 5) ? 2 : 1; addHistory(`Us took round (${pts} pt)`); }
            scores[0] += pts;
        } else {
            if (usCalled) { pts = 2; addHistory("EUCHRED! Them gets 2 pts", true); }
            else { pts = (trickCounts[1] === 5) ? 2 : 1; addHistory(`Them took round (${pts} pt)`); }
            scores[1] += pts;
        }
        updateScoreUI(); dealer = (dealer + 1) % 4; setTimeout(nextRound, 1200);
    }

    function updateScoreUI() {
        document.getElementById('score-us').innerText = scores[0];
        document.getElementById('score-them').innerText = scores[1];
        document.getElementById('tricks-us').innerText = trickCounts[0];
        document.getElementById('tricks-them').innerText = trickCounts[1];
    }
</script>
</body>
</html>
