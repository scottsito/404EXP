<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Euchre - Stable Edition</title>
    <style>
        :root { --green: #1a5d1a; --gold: #fbff00; --wood: #3e2723; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a2f0a; color: white; margin: 0; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #game-world { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }

        /* UI Panels */
        #turn-tracker { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 10px; border-left: 5px solid var(--gold); min-width: 160px; z-index: 100; }
        #match-history { position: absolute; top: 20px; right: 20px; bottom: 20px; width: 240px; background: rgba(0,0,0,0.85); border-radius: 10px; padding: 10px; font-size: 0.85rem; z-index: 100; border: 1px solid #444; }
        #history-content { height: 90%; overflow-y: auto; margin-top: 10px; border-top: 1px solid #444; padding-top: 10px; }

        /* Table */
        #table { position: relative; width: 600px; height: 400px; background: var(--green); border-radius: 200px; border: 12px solid var(--wood); box-shadow: inset 0 0 100px black; }
        #dealer-button { position: absolute; width: 30px; height: 30px; background: white; border-radius: 50%; color: black; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.7rem; transition: 0.5s; z-index: 50; border: 2px solid #333; }

        /* Cards */
        .card { width: 70px; height: 100px; background: white; color: black; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; border: 1px solid #777; box-shadow: 2px 4px 8px rgba(0,0,0,0.5); position: absolute; transition: 0.3s; font-size: 1.1rem; user-select: none; }
        .card.red { color: #d32f2f; }
        .card.back { background: #b71c1c; border: 3px solid white; background-image: radial-gradient(circle, #fff 1px, transparent 1px); background-size: 8px 8px; }
        .card.playable { cursor: pointer; border: 2px solid var(--gold); transform: translateY(-5px); }
        .card.playable:hover { transform: translateY(-15px); }

        /* Special highlight */
        .card.bower { outline: 3px solid rgba(251,255,0,0.85); box-shadow: 0 0 15px rgba(251,255,0,0.5), 2px 4px 8px rgba(0,0,0,0.5); }

        #kitty-container { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); text-align: center; }

        /* Player Areas */
        .hand { position: absolute; bottom: 20px; display: flex; gap: 10px; left: 50%; transform: translateX(-50%); height: 110px; }
        .player-label { position: absolute; font-size: 0.8rem; background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 10px; color: white; }
        .sitting-out { color: #ff4444 !important; font-style: italic; opacity: 0.6; }

        /* Overlays */
        #ui-overlay { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 500; text-align: center; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 20px; border: 2px solid var(--gold); display: none; }
        #ui-overlay.active { display: block; }
        button { padding: 10px 20px; margin: 5px; background: var(--gold); border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }

        /* Trump icon styling + pop animation */
        #trump-icon { display: inline-block; }
        .trump-pop { animation: trumpPop 300ms ease-out; }
        @keyframes trumpPop {
            0% { transform: scale(0.6); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* History suit coloring */
        .suit-red { color: #ff6b6b; }
        .suit-black { color: #e6e6e6; }

    </style>
</head>
<body>

<div id="game-world">
    <div id="turn-tracker">
        <span style="font-size: 0.7rem; opacity: 0.6;">CURRENT TURN</span><br>
        <span id="active-turn-name" style="color: var(--gold); font-weight: bold; font-size: 1.2rem;">Welcome</span>
    </div>

    <div id="match-history">
        <b style="color: var(--gold);">MATCH HISTORY</b>
        <div id="history-content"></div>
    </div>

    <div style="position: absolute; top: 20px; text-align: center; width: 100%;">
        <div style="font-size: 1.2rem; margin-bottom: 5px;">US: <span id="score-us">0</span> | THEM: <span id="score-them">0</span></div>
        <div style="font-size: 0.9rem; opacity: 0.8;">Tricks - Us: <span id="tricks-us">0</span> Them: <span id="tricks-them">0</span></div>
        <div id="trump-icon" style="font-size: 2rem;"></div>
    </div>

    <div id="ui-overlay">
        <div id="message" style="font-size: 1.5rem; margin-bottom: 15px;">PRO EUCHRE</div>
        <div id="controls"></div>
    </div>

    <div id="table">
        <div id="dealer-button">D</div>
        <div id="kitty-container"></div>
        <div id="played-area"></div>

        <div class="player-label" style="bottom: -40px; left: 50%; transform: translateX(-50%);">YOU</div>
        <div class="player-label" id="label-1" style="left: -80px; top: 50%;">BOT 1</div>
        <div class="player-label" id="label-2" style="top: -40px; left: 50%; transform: translateX(-50%);">PARTNER</div>
        <div class="player-label" id="label-3" style="right: -80px; top: 50%;">BOT 3</div>
    </div>

    <div id="player-hand" class="hand"></div>
</div>

<script>
    const SUITS = ['♠', '♣', '♥', '♦'], RANKS = ['9', '10', 'J', 'Q', 'K', 'A'];
    const SAME_COLOR = { '♠': '♣', '♣': '♠', '♥': '♦', '♦': '♥' };

    let scores = [0, 0], trickCounts = [0, 0], dealer = 0, turn = 0;
    let deck = [], playerHand = [], bots = [[],[],[]], botNames = ["Arthur", "Beatrice", "Winston"];
    let trumpSuit = null, leadSuit = null, upCard = null, bidRound = 1, caller = -1, lonePlayer = null;
    let tableCards = [], gameLock = false;

    function isRedSuit(suit) {
        return suit === '♥' || suit === '♦';
    }

    function suitSpan(suit) {
        const cls = isRedSuit(suit) ? 'suit-red' : 'suit-black';
        return `<span class="${cls}">${suit}</span>`;
    }

    function addHistory(msg, gold = false) {
        const h = document.getElementById('history-content');
        h.innerHTML += `<div style="margin-bottom:5px; ${gold ? 'color:#fbff00; font-weight:bold;' : ''}">${msg}</div>`;
        h.scrollTop = h.scrollHeight;
    }

    function playerName(p) {
        if (p === 0) return "You";
        if (p === 2) return "Partner";
        if (p === 1) return botNames[0];
        if (p === 3) return botNames[1];
        return "???";
    }

    function setTrumpIcon(suit) {
        const icon = document.getElementById('trump-icon');
        const cls = isRedSuit(suit) ? 'suit-red' : 'suit-black';
        icon.classList.remove('trump-pop');
        icon.innerHTML = `<span class="${cls}">${suit}</span>`;

        // trigger pop animation reliably
        void icon.offsetWidth;
        icon.classList.add('trump-pop');
    }

    function isRightBower(card) {
        return trumpSuit && card.rank === 'J' && card.suit === trumpSuit;
    }

    function isLeftBower(card) {
        return trumpSuit && card.rank === 'J' && card.suit === SAME_COLOR[trumpSuit];
    }

    function updateUI() {
        document.getElementById('score-us').innerText = scores[0];
        document.getElementById('score-them').innerText = scores[1];
        document.getElementById('tricks-us').innerText = trickCounts[0];
        document.getElementById('tricks-them').innerText = trickCounts[1];

        const names = [playerName(0), playerName(1), playerName(2), playerName(3)];
        document.getElementById('active-turn-name').innerText = names[turn];
    }

    function initGame() {
        scores = [0,0];
        dealer = Math.floor(Math.random()*4);

        document.getElementById('label-1').innerText = botNames[0];
        document.getElementById('label-3').innerText = botNames[1];

        nextRound();
    }

    function nextRound() {
        trickCounts = [0, 0];
        tableCards = [];
        leadSuit = null;
        lonePlayer = null;
        bidRound = 1;
        gameLock = false;
        caller = -1;
        trumpSuit = null;

        document.getElementById('played-area').innerHTML = '';
        document.getElementById('player-hand').innerHTML = '';
        document.getElementById('trump-icon').innerText = '';
        document.getElementById('label-2').classList.remove('sitting-out');
        document.getElementById('label-2').innerText = "PARTNER";

        // Shuffle & Deal
        deck = [];
        SUITS.forEach(s => RANKS.forEach(r => deck.push({ rank: r, suit: s })));
        deck.sort(() => Math.random() - 0.5);

        playerHand = deck.splice(0, 5);
        bots = [deck.splice(0, 5), deck.splice(0, 5), deck.splice(0, 5)];
        upCard = deck.pop();

        // Move Dealer Button (FIXED)
        const btn = document.getElementById('dealer-button');
        const spots = [
            { bottom: '-15px', left: '50%', transform: 'translateX(-50%)' }, // you
            { left: '-15px', top: '50%', transform: 'translateY(-50%)' },    // left bot
            { top: '-15px', left: '50%', transform: 'translateX(-50%)' },    // partner
            { right: '-15px', top: '50%', transform: 'translateY(-50%)' }    // right bot
        ];

        Object.assign(btn.style, {
            top: 'auto', bottom: 'auto', left: 'auto', right: 'auto',
            transform: 'none',
            ...spots[dealer]
        });

        renderPlayerHand();
        showKitty();

        turn = (dealer + 1) % 4;
        startBidding();
    }

    function showKitty() {
        const k = document.getElementById('kitty-container');
        const redClass = isRedSuit(upCard.suit) ? 'red' : '';
        k.innerHTML = `
            <div class="card ${redClass}" style="position:relative">
                ${upCard.rank}<br>${upCard.suit}
            </div>
        `;
    }

    function renderPlayerHand(playable = null) {
        const h = document.getElementById('player-hand');
        h.innerHTML = '';
        playerHand.forEach((c, i) => {
            const div = document.createElement('div');

            const playableNow = playable && playable.includes(c);

            div.className = 'card'
                + (isRedSuit(c.suit) ? ' red' : '')
                + (playableNow ? ' playable' : '')
                + ((isRightBower(c) || isLeftBower(c)) ? ' bower' : '');

            div.innerHTML = `${c.rank}<br>${c.suit}`;
            div.style.position = 'relative';

            if (playableNow) div.onclick = () => playCard(i);
            else div.onclick = null;

            h.appendChild(div);
        });
    }

    function startBidding() {
        updateUI();

        if (turn === 0) {
            document.getElementById('ui-overlay').classList.add('active');
            let html = `<b>Round ${bidRound}</b><br>`;

            if (bidRound === 1) {
                html += `<button onclick="decideTrump('${upCard.suit}', false)">Pick It Up</button>
                         <button onclick="decideTrump('${upCard.suit}', true)">Go Alone</button>
                         <button onclick="passBid()">Pass</button>`;
            } else {
                SUITS.filter(s => s !== upCard.suit).forEach(s => {
                    html += `<button onclick="decideTrump('${s}', false)">${s}</button>`;
                });
                html += `<button onclick="passBid()">Pass</button>`;
            }

            document.getElementById('controls').innerHTML = html;
        } else {
            setTimeout(botBid, 800);
        }
    }

    function botBid() {
        const hand = bots[turn - 1];
        const target = bidRound === 1
            ? upCard.suit
            : SUITS.filter(s => s !== upCard.suit)[Math.floor(Math.random() * 3)];

        const count = hand.filter(c =>
            c.suit === target || (c.rank === 'J' && c.suit === SAME_COLOR[target])
        ).length;

        if (count >= 3) decideTrump(target, false);
        else passBid();
    }

    function passBid() {
        addHistory(`${playerName(turn)} passed.`);
        turn = (turn + 1) % 4;

        if (turn === (dealer + 1) % 4) {
            if (bidRound === 1) {
                bidRound = 2;
                document.getElementById('kitty-container').innerHTML = '❌';
                startBidding();
            } else {
                addHistory("Everyone passed. Redealing...", true);
                dealer = (dealer + 1) % 4;
                setTimeout(nextRound, 1000);
            }
        } else {
            startBidding();
        }
    }

    function decideTrump(suit, alone) {
        trumpSuit = suit;
        caller = turn;

        document.getElementById('ui-overlay').classList.remove('active');
        setTrumpIcon(suit);

        addHistory(`${playerName(turn)} called ${suitSpan(suit)}!`, true);

        if (alone) {
            lonePlayer = turn;
            const partnerIdx = (turn + 2) % 4;

            if (partnerIdx === 2) {
                document.getElementById('label-2').innerText = "SITTING OUT";
                document.getElementById('label-2').classList.add('sitting-out');
            }
        }

        if (bidRound === 1) {
            if (dealer === 0) {
                gameLock = true;
                addHistory("Pick a card to discard for the up-card.");
                renderPlayerHand(playerHand); // all clickable -> discard
            } else {
                bots[dealer - 1].sort(() => 0.5 - Math.random()).splice(0, 1, upCard);
                startTricks();
            }
        } else {
            startTricks();
        }

        // refresh bower highlights now that trump exists
        renderPlayerHand();
    }

    function discard(idx) {
        playerHand.splice(idx, 1, upCard);
        gameLock = false;
        startTricks();
    }

    function startTricks() {
        document.getElementById('kitty-container').innerHTML = '';
        turn = (dealer + 1) % 4;
        playTurn();
    }

    function playTurn() {
        const expectedPlays = (lonePlayer !== null ? 3 : 4);

        if (tableCards.length === expectedPlays) {
            setTimeout(resolveTrick, 700);
            return;
        }

        if (lonePlayer !== null && turn === (lonePlayer + 2) % 4) {
            turn = (turn + 1) % 4;
            playTurn();
            return;
        }

        updateUI();

        if (turn === 0) {
            let legal = playerHand.filter(c => getEffSuit(c) === leadSuit);
            if (!legal.length) legal = playerHand;
            renderPlayerHand(legal);
        } else {
            setTimeout(botPlay, 700);
        }
    }

    function getEffSuit(c) {
        if (trumpSuit && c.rank === 'J' && c.suit === SAME_COLOR[trumpSuit]) return trumpSuit;
        return c.suit;
    }

    function botPlay() {
        const hand = bots[turn - 1];
        let legal = hand.filter(c => getEffSuit(c) === leadSuit);
        if (!legal.length) legal = hand;

        const card = legal[0];
        bots[turn - 1] = hand.filter(c => c !== card);
        executePlay(card);
    }

    function playCard(idx) {
        if (gameLock) { discard(idx); return; }

        const card = playerHand.splice(idx, 1)[0];
        executePlay(card);
    }

    function executePlay(card) {
        if (!leadSuit) leadSuit = getEffSuit(card);

        tableCards.push({ card, player: turn });

        const el = document.createElement('div');
        el.className = 'card'
            + (isRedSuit(card.suit) ? ' red' : '')
            + ((isRightBower(card) || isLeftBower(card)) ? ' bower' : '');

        el.innerHTML = `${card.rank}<br>${card.suit}`;

        const spots = [
            { bottom: '50px', left: '265px' }, // you
            { left: '50px', top: '150px' },    // left bot
            { top: '50px', left: '265px' },    // partner
            { right: '50px', top: '150px' }    // right bot
        ];

        Object.assign(el.style, spots[turn]);
        document.getElementById('played-area').appendChild(el);

        // If player played, update bower highlighting on remaining hand
        if (turn === 0) renderPlayerHand();

        turn = (turn + 1) % 4;
        playTurn();
    }

    function resolveTrick() {
        let bestPower = -1, winner = -1;

        tableCards.forEach(tc => {
            const p = getPower(tc.card);
            if (p > bestPower) { bestPower = p; winner = tc.player; }
        });

        trickCounts[winner % 2 === 0 ? 0 : 1]++;
        addHistory(`${playerName(winner)} took the trick.`);

        setTimeout(() => {
            document.getElementById('played-area').innerHTML = '';
            tableCards = [];
            leadSuit = null;

            if (playerHand.length === 0) resolveRound();
            else { turn = winner; playTurn(); }
        }, 700);
    }

    function getPower(c) {
        if (c.rank === 'J' && c.suit === trumpSuit) return 1000;
        if (c.rank === 'J' && c.suit === SAME_COLOR[trumpSuit]) return 900;

        let p = RANKS.indexOf(c.rank);

        if (getEffSuit(c) === trumpSuit) return p + 100;
        if (getEffSuit(c) === leadSuit) return p + 10;
        return p;
    }

    function resolveRound() {
        const usCalled = (caller === 0 || caller === 2);

        if (trickCounts[0] >= 3) {
            let pts = (trickCounts[0] === 5) ? (lonePlayer === 0 ? 4 : 2) : 1;
            if (!usCalled) pts = 2; // euchred THEM
            scores[0] += pts;
            addHistory(`US score ${pts} point${pts === 1 ? '' : 's'}!`, true);
        } else {
            let pts = (trickCounts[1] === 5) ? 2 : 1;
            if (usCalled) pts = 2; // euchred US
            scores[1] += pts;
            addHistory(`THEM score ${pts} point${pts === 1 ? '' : 's'}!`, true);
        }

        dealer = (dealer + 1) % 4;
        setTimeout(nextRound, 1500);
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('ui-overlay').classList.add('active');
        document.getElementById('controls').innerHTML = `<button onclick="initGame()">Start Game</button>`;
    });
</script>
</body>
</html>
